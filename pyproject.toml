[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logsentry"
version = "0.1.0"
description = "CLI alat za nadzor i analizu logova udaljenog servera preko SSH-a"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.28,<1",
    "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
logsentry = "logsentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["logsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
