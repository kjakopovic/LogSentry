log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt="$upstream_response_time"';

# Docker DNS: api se može ponovno pokrenuti, a nginx mora ostati živ.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    # Generator prometa simulira klijente iz drugih mreža. Zaglavlje vrijedi
    # samo za promet iz Docker podmreže, vanjski klijent ga ne može podmetnuti.
    set_real_ip_from 172.28.0.0/24;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/access.log timed;
    access_log /logs/access.log timed;

    # Interni endpointi dostupni su samo kroz SSH tunel.
    location = /health  { return 404; }
    location = /metrics { return 404; }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
