name: demoapp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: demo-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      - api
    logging: *logging

  api:
    build: ./api
    container_name: demo-api
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DATABASE_URL: "postgresql://demo:${POSTGRES_PASSWORD:?postavi POSTGRES_PASSWORD u .env}@postgres:5432/demo"
      LOG_FILE: /logs/app.log
    ports:
      # Samo na loopbacku: do /health i /metrics dolazi se kroz SSH tunel.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging: *logging

  postgres:
    image: postgres:17-alpine
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?postavi POSTGRES_PASSWORD u .env}"
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Fiksna podmreža: nginx samo njoj vjeruje za X-Forwarded-For.
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
